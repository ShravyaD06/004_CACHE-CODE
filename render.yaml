# Render Infrastructure-as-Code Blueprint
# Deploy both Backend API and Frontend UI with 1-click on Render
services:
  # 1. DocuSense AI FastAPI Backend Service
  - type: web
    name: docusense-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-2.5-flash

  # 2. DocuSense AI React Static Site
  - type: web
    name: docusense-web
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docusense-api
          property: host
